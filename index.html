<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f1eb"><meta name="description" content="Plan your room, organize your essentials, and make your space yours.">
  <title>RoomPlan — Your space, thoughtfully planned</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="RoomPlan home"><span class="brand-mark"><i></i><i></i><i></i></span><span>room<span class="brand-light">plan</span></span></a>
    <div class="workspace-label">WORKSPACE</div>
    <nav class="side-nav" aria-label="Main navigation">
      <button class="nav-link active" data-page="overview"><span class="nav-icon">⌂</span>Overview</button>
      <button class="nav-link" data-page="my-room"><span class="nav-icon">▦</span>My room</button>
      <button class="nav-link" data-page="inventory"><span class="nav-icon">▤</span>Inventory</button>
      <button class="nav-link" data-page="wishlist"><span class="nav-icon">♡</span>Wishlist</button>
      <button class="nav-link" data-page="purchases"><span class="nav-icon">↗</span>Purchases</button>
    </nav>
    <div class="workspace-label second-label">MANAGE</div>
    <nav class="side-nav">
      <button class="nav-link" data-page="budget"><span class="nav-icon">◷</span>Budget plan</button>
      <button class="nav-link" data-page="progress"><span class="nav-icon">◌</span>Progress</button>
    </nav>
    <div class="sidebar-bottom"><div class="mini-tip"><span class="tip-spark">✳</span><p>Small steps make a space feel like yours.</p><span>ROOMPLAN NOTE</span></div><button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span>Settings</button><div class="profile"><div class="avatar">R</div><div><strong>My space</strong><small>Personal workspace</small></div><span class="profile-dots">•••</span></div></div>
  </aside>
  <main class="main-area">
    <header class="topbar"><div class="mobile-brand"><span class="brand-mark"><i></i><i></i><i></i></span>room<span>plan</span></div><div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="crumb">Overview</strong></div><div class="top-actions"><span class="today" id="today"></span><button class="icon-button" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">☼</button><button class="avatar small-avatar" aria-label="Profile">R</button></div></header>
    <section class="page-content" id="pageContent" aria-live="polite"></section>
  </main>
</div>
<nav class="mobile-nav" aria-label="Mobile navigation">
  <button class="active" data-page="overview"><span>⌂</span><small>Home</small></button><button data-page="my-room"><span>▦</span><small>My room</small></button><button data-page="inventory"><span>▤</span><small>Items</small></button><button data-page="wishlist"><span>♡</span><small>Wishlist</small></button><button data-page="progress"><span>◌</span><small>Progress</small></button>
</nav>
<div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><span class="eyebrow">ROOMPLAN COLLECTION</span><h2 id="modalTitle">Add an item</h2></div><button class="icon-button" id="closeModal" aria-label="Close">×</button></div><form id="itemForm"><label>Item name<input name="name" required maxlength="60" placeholder="e.g. Reading lamp"></label><div class="form-grid"><label>Category<select name="category"><option>Room</option><option>Clothing</option><option>Electronics</option><option>Mobile setup</option><option>Laptop setup</option><option>Computer setup</option></select></label><label>List<select name="list"><option value="wishlist">Wishlist</option><option value="inventory">Already owned</option></select></label></div><div class="form-grid"><label>Estimated price (Rp)<input name="price" type="number" min="0" step="1000" placeholder="0"></label><label>Priority<select name="priority"><option>Essential</option><option>High</option><option>Medium</option><option>Low</option></select></label></div><label>Short note<input name="note" maxlength="120" placeholder="Optional details"></label><div class="modal-actions"><button type="button" class="button quiet" id="cancelModal">Cancel</button><button type="submit" class="button primary">Save item <span>↗</span></button></div></form></section></div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
